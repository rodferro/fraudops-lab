server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: fraudops-api
  lifecycle:
    timeout-per-shutdown-phase: 25s
  jackson:
    # Strict request contract: no silently ignored typos and no "250" -> 250.0 coercion.
    deserialization:
      fail-on-unknown-properties: true
    mapper:
      allow-coercion-of-scalars: false

fraud:
  model:
    path: ${FRAUD_MODEL_PATH:./fraud_model.onnx}
    metadata-path: ${FRAUD_MODEL_METADATA_PATH:./model_metadata.json}
  decision:
    review-threshold: ${FRAUD_REVIEW_THRESHOLD:0.06729906797409058}

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,model
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      minimum-expected-value:
        http.server.requests: 1ms
      maximum-expected-value:
        http.server.requests: 2s
  tracing:
    sampling:
      probability: ${FRAUD_TRACE_SAMPLE_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${FRAUD_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
      export:
        enabled: ${FRAUD_TRACE_EXPORT_ENABLED:false}

logging:
  pattern:
    console: "image=${FRAUD_IMAGE_REVISION:exp004} %d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p trace_id=%X{traceId:-} span_id=%X{spanId:-} %logger{36} - %msg%n"
