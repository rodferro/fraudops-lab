apiVersion: v1
kind: Pod
metadata:
  name: fraudops-client
  namespace: fraudops-exp003
  labels:
    app: fraudops-client
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: client
      image: fraudops-exp003-client:exp003
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 8081
      readinessProbe:
        tcpSocket:
          port: 8081
        periodSeconds: 2
      resources:
        requests:
          cpu: 50m
          memory: 96Mi
        limits:
          cpu: 250m
          memory: 192Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir:
        sizeLimit: 32Mi
