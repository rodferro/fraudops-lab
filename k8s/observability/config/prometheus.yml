global:
  scrape_interval: 2s
  scrape_timeout: 1s
  evaluation_interval: 2s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: fraudops-api
    metrics_path: /actuator/prometheus
    kubernetes_sd_configs:
      - role: endpointslice
        namespaces:
          names: [fraudops-exp003]
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name]
        regex: fraudops-api|fraudops-alert-demo
        action: keep
      - source_labels: [__meta_kubernetes_endpointslice_endpoint_conditions_ready]
        regex: "true"
        action: keep
      - source_labels: [__meta_kubernetes_endpointslice_port_name]
        regex: http
        action: keep
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: app
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
