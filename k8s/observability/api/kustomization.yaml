apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: fraudops-api
    newTag: exp004
replicas:
  - name: fraudops-api
    count: 3
patches:
  - target:
      kind: Deployment
      name: fraudops-api
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: FRAUD_TRACE_EXPORT_ENABLED
            value: "true"
          - name: FRAUD_OTLP_ENDPOINT
            value: http://otel-collector:4318/v1/traces
          - name: FRAUD_TRACE_SAMPLE_PROBABILITY
            value: "1.0"
