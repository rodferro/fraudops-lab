apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fraudops-exp003
resources:
  - prometheus.yaml
  - grafana.yaml
  - tracing.yaml
configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yml=config/prometheus.yml
      - alerts.yml=config/alerts.yml
  - name: otel-config
    files:
      - collector.yml=config/collector.yml
  - name: grafana-provisioning
    files:
      - datasources.yml=grafana/datasources.yml
      - dashboards.yml=grafana/dashboards.yml
  - name: fraudops-dashboard
    files:
      - fraudops-overview.json=grafana/fraudops-overview.json
